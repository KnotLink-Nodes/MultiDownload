[project]
name = "multidownload"
version = "1.0.0"
description = "IDM-style async multi-threaded HTTP downloader with TLS fingerprint emulation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
authors = [{name = "XiaoYouChR"}]
keywords = ["download", "http", "async", "idm", "multi-threaded"]

[project.scripts]
md = "multidownload.__main__:main"
multidownload = "multidownload.__main__:main"

[project.optional-dependencies]
tls = ["wreq>=0.12.0"]
test = ["pytest", "pytest-asyncio", "aiohttp"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
